<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoinFlip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <!-- ═══════════ NAVBAR ═══════════ -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand">
        <span class="brand-coin">⬤</span>
        <span class="brand-text">COIN<span class="brand-accent">FLIP</span></span>
      </div>
      <div class="navbar-links">
        <a href="#" class="nav-link active">Home</a>
        <a href="#" class="nav-link">History</a>
        <a href="#" class="nav-link">Leaderboard</a>
      </div>
      <div class="navbar-actions">
        <div class="balance-pill">
          <span class="balance-icon">🪙</span>
          <span class="balance-value">1,250 R$</span>
        </div>
        <button class="btn-nav-login">Sign In</button>
      </div>
    </div>
  </nav>

  <!-- ═══════════ HERO ═══════════ -->
  <div class="hero-wrapper">
    <div class="hero-glow"></div>
    <div class="hero-content anim-fadein-up" style="--delay:0s">
      <h1 class="hero-title">COIN<span class="accent">FLIP</span></h1>
      <p class="hero-subtitle">Choose gold or silver, wager your items, and flip for the win.</p>
    </div>

    <!-- Stats row -->
    <div class="stats-row anim-fadein-up" style="--delay:0.15s">
      <div class="stat-item">
        <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <div>
          <p class="stat-value">142</p>
          <p class="stat-label">Online</p>
        </div>
      </div>
      <div class="stat-item">
        <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        <div>
          <p class="stat-value">1,203</p>
          <p class="stat-label">Games Today</p>
        </div>
      </div>
      <div class="stat-item">
        <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <div>
          <p class="stat-value">2.4M</p>
          <p class="stat-label">Total Wagered</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════ MAIN CONTENT ═══════════ -->
  <main class="main-content">

    <!-- Section header -->
    <div class="section-header">
      <div class="section-title-group">
        <div class="section-bar"></div>
        <h2 class="section-title">Active Games</h2>
        <span class="section-badge" id="game-count-badge">3 open</span>
      </div>
      <button class="btn-create" id="btn-create-game">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create Game
      </button>
    </div>

    <!-- Games grid -->
    <div class="games-grid anim-fadein" style="--delay:0.25s" id="games-grid">
      <!-- Cards injected by JS -->
    </div>

  </main>

  <!-- ═══════════ CREATE GAME MODAL ═══════════ -->
  <div class="modal-overlay" id="modal-overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Create Game</h2>
        <button class="modal-close" id="modal-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <p class="modal-desc">Choose your coin side and set your wager amount.</p>

        <div class="form-group">
          <label class="form-label">Choose Your Side</label>
          <div class="coin-choice-row">
            <button class="coin-choice active" data-coin="gold" id="choice-gold">
              <div class="coin-preview coin-gold">
                <span class="coin-icon-large">🥇</span>
              </div>
              <span class="coin-choice-label">Gold</span>
            </button>
            <button class="coin-choice" data-coin="silver" id="choice-silver">
              <div class="coin-preview coin-silver">
                <span class="coin-icon-large">🥈</span>
              </div>
              <span class="coin-choice-label">Silver</span>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="wager-input">Wager Amount (R$)</label>
          <div class="input-wrapper">
            <span class="input-prefix">R$</span>
            <input
              type="number"
              id="wager-input"
              class="form-input"
              placeholder="0"
              min="1"
              max="100000"
            />
          </div>
          <p class="form-hint">Available balance: <strong>1,250 R$</strong></p>
        </div>

        <div class="modal-footer">
          <button class="btn-cancel" id="btn-cancel">Cancel</button>
          <button class="btn-confirm" id="btn-confirm">Create Game</button>
        </div>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
